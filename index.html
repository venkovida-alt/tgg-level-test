<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomorrow's Golden Generation — English Level Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --primary:#b8860b; --primary-dark:#9a7109; --accent:#2563eb;
    --dark:#1e293b; --light:#fdf9ef; --gray:#64748b; --ok:#16a34a;
    --gold:#d4af37; --gold-light:#f5e6a8; --gold-dark:#8b6f47;
  }
  body { font-family:'Myanmar Text','Pyidaungsu','Padauk','Segoe UI',sans-serif;
         background:linear-gradient(135deg,#b8860b,#d4a017); min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px; color:var(--dark); }
  .card { background:#fff; border-radius:20px; max-width:760px; width:100%;
          box-shadow:0 20px 60px rgba(0,0,0,.25); overflow:hidden; }
  .card-header { background:linear-gradient(135deg,#b8860b,#d4a017); color:#fff; padding:24px 32px;
                 display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .card-header h1 { font-size:1.4rem; }

  .card-body { padding:32px; }

  .home-hero {
    text-align:center; padding: 32px 16px 28px;
    background: linear-gradient(180deg, #fffef9, #fdf8ec);
    border-radius: 20px; border: 2px solid var(--gold);
    position: relative; overflow: hidden; margin-bottom: 24px;
  }
  .home-hero::before {
    content: ''; position: absolute; inset: 8px;
    border: 1px solid rgba(212,175,55,.35); border-radius: 14px; pointer-events: none;
  }
  .home-ornament {
    font-family: Georgia, serif; color: var(--gold);
    font-size: 1.2rem; letter-spacing: 10px; margin-bottom: 10px; opacity: .85;
  }
  .home-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 2rem; font-weight: 900;
    background: linear-gradient(135deg, #8b6f47, #d4af37, #f5e6a8, #d4af37, #8b6f47);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    letter-spacing: 1px; line-height: 1.3; margin-bottom: 10px;
    position: relative; z-index: 1;
  }
  .home-subtitle {
    font-size: 1rem; color: var(--gold-dark); font-weight: 600;
    letter-spacing: 2px; margin-bottom: 6px; position: relative; z-index: 1;
  }
  .home-sub2 { font-size: .88rem; color: var(--gray); position: relative; z-index: 1; }

  .compare-title {
    font-family: Georgia, serif; font-size: 1.15rem; color: var(--gold-dark);
    text-align: center; margin-bottom: 6px; letter-spacing: 1px;
  }
  .compare-sub { text-align: center; font-size: .82rem; color: var(--gray); margin-bottom: 18px; }
  .compare-table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(184,134,11,.12);
    border: 1.5px solid rgba(212,175,55,.5); margin-bottom: 24px;
  }
  .compare-table thead th {
    background: linear-gradient(135deg, #8b6f47, #d4af37);
    color: #fff; font-family: Georgia, serif; font-size: .8rem;
    letter-spacing: 1px; padding: 12px 6px; text-align: center;
    font-weight: 700; text-transform: uppercase;
  }
  .compare-table tbody td {
    padding: 11px 6px; text-align: center; font-size: .86rem;
    border-top: 1px solid rgba(212,175,55,.25); background: #fffefb;
  }
  .compare-table tbody tr:nth-child(even) td { background: #fdf8ec; }
  .compare-table tbody td:first-child {
    font-weight: 700; color: var(--gold-dark);
    font-family: Georgia, serif; letter-spacing: .5px;
  }
  .compare-table tbody td:nth-child(2) { color: var(--accent); font-weight: 700; }
  .tgg-badge {
    display: inline-block; padding: 3px 10px;
    background: linear-gradient(135deg, #d4af37, #f5e6a8);
    color: #5a4a2f; border-radius: 20px;
    font-size: .72rem; font-weight: 800; letter-spacing: .5px;
  }

  .start-wrap { text-align: center; margin-top: 8px; }
  .btn-start {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 18px 56px;
    background: linear-gradient(135deg, #8b6f47 0%, #d4af37 30%, #f5e6a8 50%, #d4af37 70%, #8b6f47 100%);
    color: #fffef9; font-family: Georgia, serif;
    font-size: 1.15rem; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    border: 3px solid #fff; outline: 2px solid var(--gold); outline-offset: 4px;
    border-radius: 50px; cursor: pointer; transition: all .25s ease;
    box-shadow: 0 15px 35px rgba(184,134,11,.5),
      inset 0 2px 5px rgba(255,255,255,.6), inset 0 -3px 8px rgba(0,0,0,.2);
    text-shadow: 1px 2px 6px rgba(0,0,0,.35);
  }
  .btn-start:hover { transform: translateY(-3px) scale(1.03); }
  .btn-start:active { transform: translateY(0) scale(1); }
  .start-note { margin-top: 16px; font-size: .82rem; color: var(--gray); line-height: 1.7; }
  .start-note b { color: var(--gold-dark); }

  .progress-wrap { background:#f1f5f9; border-radius:20px; height:10px; margin-bottom:26px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--primary),#f0c75e); width:0%;
                  transition:width .35s ease; border-radius:20px; }
  .q-meta { display:flex; justify-content:space-between; color:var(--gray); font-size:.85rem; margin-bottom:10px; }
  .question { font-size:1.25rem; font-weight:600; margin:20px 0; line-height:1.7; }
  .options { display:flex; flex-direction:column; gap:12px; }
  .option { text-align:left; padding:14px 18px; border:2px solid #e2e8f0; border-radius:12px;
            background:#fff; font-size:1.05rem; cursor:pointer; transition:all .15s; font-family:inherit; }
  .option:hover:not(:disabled) { border-color:var(--primary); background:var(--light); }
  .option.selected { border-color:var(--primary); background:#fef3c7; font-weight:600; }
  .option:disabled { cursor:default; opacity:.65; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:26px; gap:12px; flex-wrap:wrap; }
  .btn { padding:12px 24px; border-radius:10px; border:none; font-weight:600; font-size:.95rem;
         cursor:pointer; font-family:inherit; transition:all .2s; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover:not(:disabled) { background:var(--primary-dark); }
  .btn-primary:disabled { background:#e2e8f0; color:#94a3b8; cursor:not-allowed; }
  .btn-ghost { background:transparent; color:var(--gray); }
  .btn-ghost:hover:not(:disabled) { color:var(--dark); }
  .btn-ghost:disabled { opacity:0; cursor:default; }
  .btn-png { background:#7c3aed; color:#fff; }
  .btn-png:hover { background:#6d28d9; }
  .btn-jpg { background:#0891b2; color:#fff; }
  .btn-jpg:hover { background:#0e7490; }
  .btn-pdf { background:var(--accent); color:#fff; }
  .btn-pdf:hover { background:#1d4ed8; }

  .lux-wrap {
    background: linear-gradient(180deg, #fefcf5 0%, #fdf8ec 100%);
    border-radius: 24px; padding: 8px;
    box-shadow: 0 20px 60px rgba(184,134,11,.15); margin-bottom: 20px;
  }
  .lux-frame {
    border: 2px solid var(--gold); border-radius: 18px;
    padding: 8px; position: relative;
    background: linear-gradient(180deg, #fffef9, #fffbf0);
  }
  .lux-frame::before {
    content:''; position: absolute; inset: 6px;
    border: 1px solid rgba(212,175,55,.4); border-radius: 12px; pointer-events: none;
  }
  .lux-inner { padding: 34px 20px 28px; text-align: center; position: relative; z-index: 1; }
  .lux-ornament-top {
    font-family: Georgia, serif; color: var(--gold);
    font-size: 1.3rem; letter-spacing: 12px; margin-bottom: 14px; opacity: .8;
  }
  .level-label {
    display: block; font-family: Georgia, serif;
    font-size: 0.8rem; color: var(--gold-dark);
    letter-spacing: 5px; margin-bottom: 18px; font-weight: 700; text-transform: uppercase;
  }
  .badge-lux {
    display: inline-block; position: relative;
    background: linear-gradient(135deg, #8b6f47 0%, #d4af37 25%, #f5e6a8 50%, #d4af37 75%, #8b6f47 100%);
    color: #fffef9; font-family: Georgia, serif;
    font-size: 2.4rem; font-weight: 900;
    padding: 22px 60px; border-radius: 10px; margin-bottom: 20px;
    letter-spacing: 4px; text-transform: uppercase;
    box-shadow: 0 18px 45px rgba(184,134,11,.55), 0 6px 15px rgba(184,134,11,.35),
      inset 0 2px 6px rgba(255,255,255,.6), inset 0 -3px 8px rgba(0,0,0,.25);
    border: 3px solid #fff; outline: 1px solid var(--gold); outline-offset: 5px;
    text-shadow: 2px 3px 10px rgba(0,0,0,.35); line-height: 1.2;
  }
  .badge-lux::before, .badge-lux::after {
    content: '✦'; position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 1.2rem; color: rgba(255,255,255,.85);
    text-shadow: 0 0 8px rgba(255,255,255,.6);
  }
  .badge-lux::before { left: 18px; }
  .badge-lux::after  { right: 18px; }
  .lux-divider {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; color: var(--gold); margin: 4px 0 20px; font-size: .9rem;
  }
  .lux-divider::before, .lux-divider::after {
    content: ''; height: 1px; width: 60px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .lux-summary {
    font-family: Georgia, serif; font-size: 1rem; color: #5a4a2f;
    line-height: 1.85; max-width: 480px; margin: 0 auto; font-style: italic;
  }

  .score-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin: 20px 0;
  }
  .score-box {
    background: linear-gradient(180deg, #fffef9, #fdf6e3);
    border-radius: 12px; padding: 14px 6px; text-align: center;
    border: 1.5px solid rgba(212,175,55,.5);
    box-shadow: 0 6px 16px rgba(184,134,11,.1), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .score-box b { display: block; font-family: Georgia, serif; font-size: 1.2rem;
                 color: var(--gold-dark); margin-bottom: 3px; font-weight: 800; }
  .score-box span { font-size: .68rem; color: #8b6f47; letter-spacing: .5px;
                    text-transform: uppercase; font-weight: 600; line-height: 1.3;
                    display: block; }

  .reco {
    background: linear-gradient(180deg, #fdfaf1, #fbf5e6);
    border-left: 4px solid var(--gold); border-radius: 12px;
    padding: 20px 22px; margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(184,134,11,.08);
  }
  .reco h3 { font-family: Georgia, serif; font-size: 1.1rem;
             color: var(--gold-dark); margin-bottom: 12px; letter-spacing: 1px; }
  .reco ul { margin-left: 4px; color: #4a3d24; list-style: none; }
  .reco li { margin-bottom: 9px; line-height: 1.75; padding-left: 4px; font-size: .93rem; }
  .note {
    background: linear-gradient(180deg, #fdfaf1, #fbf5e6);
    border-radius: 10px; padding: 14px 18px; font-size: .9rem;
    color: #6b5940; margin-bottom: 20px; line-height: 1.8;
    border: 1px dashed rgba(212,175,55,.5); font-style: italic;
  }
  .center { text-align:center; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:center; }
  .print-hint { font-size:0.78rem; color:#b91c1c; margin-top:8px; width:100%; }
  .review { margin-top:10px; }
  .review h3 { font-family: Georgia, serif; margin-bottom: 14px;
               color: var(--gold-dark); letter-spacing: 1px; }
  .rev-item {
    border:1px solid rgba(212,175,55,.35); border-radius:10px;
    padding:12px 16px; margin-bottom:10px; font-size:.93rem;
    background: linear-gradient(180deg, #fffefb, #fdfaf1);
  }
  .rev-item .ans-line { color:var(--gray); margin-top:4px; }
  .ok { color:var(--ok); font-weight:700; }
  .bad { color:#dc2626; font-weight:700; }

  .q-timer-row { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .q-timer-icon { font-size:1rem; }
  .q-timer-track { flex:1; height:9px; background:#e2e8f0; border-radius:9px; overflow:hidden; }
  .q-timer-fill { height:100%; width:100%; border-radius:9px;
                  background:linear-gradient(90deg,#16a34a,#22c55e);
                  transition:width 1s linear, background .3s; }
  .q-timer-fill.warn { background:linear-gradient(90deg,#ea580c,#f97316); }
  .q-timer-fill.danger { background:linear-gradient(90deg,#dc2626,#ef4444); }
  .q-timer-num { font-weight:800; font-size:.95rem; color:#16a34a;
                 min-width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .q-timer-num.warn { color:#ea580c; }
  .q-timer-num.danger { color:#dc2626; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.65;} }

  #resultCapture {
    padding: 22px;
    background: linear-gradient(180deg, #fefcf5, #fdf8ec);
    border-radius: 20px;
  }
  .capture-brand { text-align: center; margin-bottom: 18px; }
  .capture-brand h2 {
    font-family: Georgia, serif; font-size: 1.3rem;
    background: linear-gradient(135deg, #8b6f47, #d4af37, #f5e6a8, #d4af37, #8b6f47);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    letter-spacing: 1px; margin-bottom: 4px;
  }
  .capture-brand p {
    font-size: .78rem; color: var(--gold-dark); letter-spacing: 2px; text-transform: uppercase;
  }

  .print-sheet { display:none; }
  @media print {
    @page { margin: 1.5cm; }
    body { background:#fff; display:block; padding:0; }
    .card { display:none; }
    .print-sheet { display:block !important; color:#000; font-size:12pt; }
  }
  .ps-header { border-bottom:4px solid var(--primary); padding-bottom:14px; margin-bottom:20px; }
  .ps-header h1 { color:var(--primary-dark); font-size:20pt; font-family: Georgia, serif; }
  .ps-header .ps-sub { color:var(--gray); font-size:10pt; }
  .ps-row { display:flex; justify-content:space-between; margin:6px 0; font-size:11pt; }
  .ps-badge { text-align:center; margin:22px 0; }
  .ps-badge .b { display:inline-block; background:#f5e6c4; color:#7a5b06; border:2px solid var(--primary);
                 font-size:20pt; font-weight:900; padding:12px 40px; border-radius:40px;
                 letter-spacing:2px; font-family: Georgia, serif; }
  .ps-scores { width:100%; border-collapse:collapse; margin:14px 0; }
  .ps-scores th, .ps-scores td { border:1px solid #cbd5e1; padding:8px 12px; text-align:center; font-size:11pt; }
  .ps-scores th { background:#f5e6c4; }
  .ps-reco { margin:16px 0; }
  .ps-reco h2 { font-size:13pt; color:var(--primary-dark); margin-bottom:8px; font-family: Georgia, serif; }
  .ps-reco ul { margin-left:22px; }
  .ps-reco li { margin-bottom:5px; }
  .ps-note { background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:12px 16px; font-size:10.5pt; color:#475569; margin-top:16px; }
  .ps-footer { margin-top:34px; border-top:1px solid #cbd5e1; padding-top:12px; font-size:9.5pt; color:#64748b; text-align:center; }

  @media (max-width:620px) {
    .card-body { padding:20px; }
    .score-grid { grid-template-columns:repeat(3,1fr); }
    .question { font-size:1.1rem; }
    .card-header { flex-direction:column; align-items:flex-start; }
    .badge-lux { font-size:1.5rem; padding:16px 30px; letter-spacing:2px; }
    .badge-lux::before, .badge-lux::after { font-size: .9rem; }
    .badge-lux::before { left: 10px; }
    .badge-lux::after  { right: 10px; }
    .home-title { font-size: 1.4rem; }
    .btn-start { padding: 16px 36px; font-size: 1rem; }
    .compare-table thead th, .compare-table tbody td { padding: 8px 3px; font-size: .7rem; }
    .tgg-badge { font-size: .65rem; padding: 2px 6px; }
    #resultCapture { padding: 14px; }
  }
</style>
</head>

<div class="card">
  <div class="card-header">
    <div>
      <h1>📝 English Level Test</h1>
    </div>
  </div>
  <div class="card-body" id="app"></div>
</div>

<div class="print-sheet" id="printSheet"></div>

<script>
// ============ 7 LEVELS ============
const LEVELS = [
  'Starter','Beginner','Elementary','Pre-Intermediate',
  'Intermediate','Upper-Intermediate','Advanced'
];
const PER = 8;           // quiz တစ်ခုလျှင် level တစ်ခုမှ မေးခွန်းအရေအတွက်
const PASS = 5;          // PASS ဖြစ်ရန် လိုအပ်သော အဖြေမှန်အရေအတွက်
const QUESTION_SECONDS = 30;

// =====================================================================
//  QUESTION BANK — Cambridge "Grammar in Use" 3 books ကို ခြုံငုံထားသည်
//  Level 0-2: Essential Grammar in Use (Red)     — A1-A2
//  Level 3-5: Grammar in Use (Blue)              — B1-B2
//  Level 6:   Advanced Grammar in Use (Green)    — C1-C2
//  Level တစ်ခုလျှင် မေးခွန်း ၂၄ ခု → quiz ဖြေတိုင်း ၈ ခု ကျပန်းရွေး
// =====================================================================
const BANK = [
  // ==================== 0. STARTER (Red Book 1-40) ====================
  { level:0, q:'She ___ a teacher.', options:['is','are','am','be'], answer:0 },
  { level:0, q:'I ___ rice every day.', options:['eat','eats','eating','ate'], answer:0 },
  { level:0, q:'___ is your name?', options:['What','Where','Who','When'], answer:0 },
  { level:0, q:'There ___ one book on the table.', options:['is','are','am','be'], answer:0 },
  { level:0, q:'They ___ from Myanmar.', options:['is','are','am','be'], answer:1 },
  { level:0, q:'He ___ to school by bus.', options:['go','goes','going','went'], answer:1 },
  { level:0, q:'___ you speak English?', options:['Do','Are','Is','Can'], answer:3 },
  { level:0, q:'This is ___ apple.', options:['a','an','the','two'], answer:1 },
  { level:0, q:'The cat is ___ the box.', options:['in','on','at','of'], answer:0 },
  { level:0, q:'I have ___ brothers.', options:['a','an','two','he'], answer:2 },
  { level:0, q:"She gets up ___ 6 o'clock.", options:['in','on','at','by'], answer:2 },
  { level:0, q:'My father ___ a new car.', options:['have','has','having','haves'], answer:1 },
  { level:0, q:'We ___ students.', options:['is','are','am','be'], answer:1 },
  { level:0, q:'___ is the weather today?', options:['How','Who','Where','Whose'], answer:0 },
  { level:0, q:'Please ___ the door.', options:['open','opens','opening','opened'], answer:0 },
  { level:0, q:'___ is that man? — He is my uncle.', options:['Who','What','How','Where'], answer:0 },
  { level:0, q:'I see two ___ on the table.', options:['book','books','bookes','bookies'], answer:1 },
  { level:0, q:'___ is my book.', options:['This','These','Those','They'], answer:0 },
  { level:0, q:'This is ___ bag.', options:['I','me','my','mine'], answer:2 },
  { level:0, q:'She ___ reading a book now.', options:['am','is','are','be'], answer:1 },
  { level:0, q:'They ___ not playing football.', options:['is','am','are','be'], answer:2 },
  { level:0, q:'___ she your sister?', options:['Is','Are','Am','Be'], answer:0 },
  { level:0, q:'___ he like tea?', options:['Do','Does','Is','Are'], answer:1 },
  { level:0, q:'___ do you live?', options:['What','Where','Who','When'], answer:1 },

  // ==================== 1. BEGINNER (Red Book 41-80) ====================
  { level:1, q:'I ___ not like coffee.', options:['am','is','do','does'], answer:2 },
  { level:1, q:'She ___ like fish.', options:["don't","doesn't","isn't","aren't"], answer:1 },
  { level:1, q:'I ___ two sisters.', options:['have got','has got','am got','is got'], answer:0 },
  { level:1, q:'This is ___ book.', options:['he','him','his','he\'s'], answer:2 },
  { level:1, q:'Look! It ___ raining.', options:['is','are','am','be'], answer:0 },
  { level:1, q:'I ___ tired yesterday.', options:['am','is','was','were'], answer:2 },
  { level:1, q:'We ___ TV last night.', options:['watch','watches','watched','watching'], answer:2 },
  { level:1, q:'She ___ to school yesterday.', options:['go','goes','went','going'], answer:2 },
  { level:1, q:'He ___ come to the party.', options:["didn't","doesn't","isn't","wasn't"], answer:0 },
  { level:1, q:'___ you see him last night?', options:['Did','Do','Was','Were'], answer:0 },
  { level:1, q:'I was born ___ 2005.', options:['at','on','in','by'], answer:2 },
  { level:1, q:'The meeting is ___ Monday.', options:['in','on','at','by'], answer:1 },
  { level:1, q:"We'll meet ___ 3 o'clock.", options:['in','on','at','by'], answer:2 },
  { level:1, q:'How ___ apples do you want?', options:['much','many','a lot','any'], answer:1 },
  { level:1, q:'How ___ sugar do you need?', options:['much','many','few','number'], answer:0 },
  { level:1, q:"There isn't ___ milk in the fridge.", options:['some','any','a','many'], answer:1 },
  { level:1, q:'I have ___ questions to ask.', options:['any','some','much','a'], answer:1 },
  { level:1, q:'I like ___ football.', options:['play','plays','playing','played'], answer:2 },
  { level:1, q:'I ___ like some tea.', options:['would','will','am','do'], answer:0 },

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuiz() {
  let picked = [];
  for (let l = 0; l < LEVELS.length; l++) {
    const pool = BANK.filter(q => q.level === l);
    picked = picked.concat(shuffle(pool).slice(0, PER));
  }
  return shuffle(picked).map(q => {
    const order = shuffle([0,1,2,3]);
    return {
      level: q.level,
      q: q.q,
      options: order.map(i => q.options[i]),
      answer: order.indexOf(q.answer),
    };
  });
}

let quiz = [];
let answers = [];
let current = 0;
let submitted = false;
let timedOut = false;
const app = document.getElementById('app');

let qTimerId = null;
let qRemaining = 0;
let timerForQuestion = -1;

function startQuestionTimer() {
  clearInterval(qTimerId);
  qRemaining = QUESTION_SECONDS;
  updateQTimerUI();
  qTimerId = setInterval(() => {
    qRemaining--;
    updateQTimerUI();
    if (qRemaining <= 0) {
      clearInterval(qTimerId);
      autoNext();
    }
  }, 1000);
}

function updateQTimerUI() {
  const fill = document.getElementById('qTimerFill');
  const num  = document.getElementById('qTimerText');
  if (!fill || !num) return;
  const pct = Math.max(0, (qRemaining / QUESTION_SECONDS) * 100);
  fill.style.width = pct + '%';
  num.textContent = qRemaining + 's';
  const danger = qRemaining <= 5;
  const warn   = !danger && qRemaining <= QUESTION_SECONDS * 0.5;
  fill.classList.toggle('warn', warn);
  fill.classList.toggle('danger', danger);
  num.classList.toggle('warn', warn);
  num.classList.toggle('danger', danger);
}

function autoNext() {
  if (submitted) return;
  if (current < quiz.length - 1) { current++; renderQuiz(); }
  else { submitted = true; renderQuiz(); }
}

function startQuiz() {
  quiz = buildQuiz();
  answers = new Array(quiz.length).fill(null);
  current = 0;
  submitted = false;
  timedOut = false;
  timerForQuestion = -1;
  renderQuiz();
}

// ================ QUIZ ================
function renderQuiz() {
  if (submitted) { clearInterval(qTimerId); renderResult(); return; }
  const q = quiz[current];
  const total = quiz.length;
  const pct = (current / total) * 100;
  const qPct = Math.max(0, (qRemaining / QUESTION_SECONDS) * 100);
  const danger = qRemaining <= 5;
  const warn   = !danger && qRemaining <= QUESTION_SECONDS * 0.5;

  app.innerHTML = `
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="q-meta"><span>မေးခွန်း ${current+1} / ${total}</span></div>
    <div class="q-timer-row">
      <span class="q-timer-icon">⏱️</span>
      <div class="q-timer-track">
        <div class="q-timer-fill ${danger?'danger':warn?'warn':''}" id="qTimerFill" style="width:${qPct}%"></div>
      </div>
      <span class="q-timer-num ${danger?'danger':warn?'warn':''}" id="qTimerText">${qRemaining}s</span>
    </div>
    <div class="question">${q.q}</div>
    <div class="options">
      ${q.options.map((opt, i) => `
        <button class="option ${answers[current]===i?'selected':''}"
                onclick="choose(${i})" ${answers[current]!==null?'disabled':''}>${String.fromCharCode(65+i)}. ${opt}</button>
      `).join('')}
    </div>
    <div class="nav-btns">
      <button class="btn btn-ghost" onclick="prev()" ${current===0?'disabled':''}>← ယခင်မေးခွန်း</button>
      <button class="btn btn-primary" id="nextBtn" onclick="next()" ${answers[current]===null?'disabled':''}>
        ${current===total-1 ? '✅ ရလဒ်ကြည့်ရန်' : 'နောက်မေးခွန်း →'}
      </button>
    </div>
  `;

  if (timerForQuestion !== current) {
    timerForQuestion = current;
    startQuestionTimer();
  }
}

function choose(i) {
  if (answers[current] !== null) return;
  answers[current] = i;
  document.querySelectorAll('.option').forEach((btn, idx) => {
    btn.classList.toggle('selected', idx === i);
    btn.disabled = true;
  });
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.disabled = false;
}

function prev() { if (current > 0) { current--; renderQuiz(); } }
function next() {
  if (answers[current] === null) return;
  if (current < quiz.length - 1) { current++; renderQuiz(); }
  else { submitted = true; renderQuiz(); }
}

function computeResult() {
  const perLevel = new Array(LEVELS.length).fill(0);
  quiz.forEach((q, idx) => { if (answers[idx]===q.answer) perLevel[q.level]++; });
  let est = 0;
  for (let l=0; l<LEVELS.length; l++) {
    if (perLevel[l] >= PASS) est = l;
    else break;
  }
  const answered = answers.filter(a => a!==null).length;
  return { perLevel, est, answered };
}

async function downloadImage(format) {
  const target = document.getElementById('resultCapture');
  const { est } = computeResult();
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }).replace(/ /g, '-');
  const filename = `TGG_Level_Test_${LEVELS[est]}_${dateStr}`;
  if (typeof html2canvas === 'undefined') {
    alert('⚠️ ပုံဒေါင်းလုဒ်လုပ်ရန် internet လိုအပ်ပါတယ်။ ခဏစောင့်ပြီး ပြန်စမ်းပါ။');
    return;
  }
  try {
    const canvas = await html2canvas(target, {
      backgroundColor: format === 'jpeg' ? '#ffffff' : null,
      scale: 2, useCORS: true, logging: false,
    });
    const link = document.createElement('a');
    link.download = `${filename}.${format === 'jpeg' ? 'jpg' : 'png'}`;
    link.href = canvas.toDataURL(format === 'jpeg' ? 'image/jpeg' : 'image/png', 0.95);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (err) {
    alert('ပုံသိမ်းရာတွင် အမှားဖြစ်သွားပါတယ်: ' + err.message);
  }
}

  const printSheet = document.getElementById('printSheet');
  printSheet.innerHTML = `

      <span><b>Time:</b> ${timeStr}</span>
    </div>
    <div class="ps-row">
      <span><b>Score:</b> ${totalCorrect} / ${quiz.length}</span>
      <span><b>Answered:</b> ${answered} / ${quiz.length}</span>
    </div>
    <div class="ps-badge"><span class="b">✦ ${reco.level} ✦</span></div>
    <table class="ps-scores">
      <tr><th>Level</th>${LEVELS.map(l=>`<th>${l}</th>`).join('')}</tr>
      <tr><td>Score</td>${perLevel.map(s=>`<td>${s}/${PER}</td>`).join('')}</tr>
    </table>
    <div class="ps-reco">
      <h2>📚 Recommended Learning Plan</h2>
